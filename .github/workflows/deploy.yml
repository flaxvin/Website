name: Publish site

# GitHub Pages for this repository serves the `gh-pages` branch with the custom
# domain flaxvin.tech. `main` is the working branch; this job mirrors it to
# `gh-pages` on every push, which is what triggers the Pages rebuild.
#
# Nothing is compiled — the site is static HTML served from the repository root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git push --force origin gh-pages

      - name: Summary
        run: echo "Published to https://flaxvin.tech/" >> "$GITHUB_STEP_SUMMARY"
